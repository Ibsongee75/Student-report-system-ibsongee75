<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>This site has moved</title>

    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://ibsongee75.github.io/student_report/">

    <!-- Fallback for browsers with JavaScript turned off -->
    <meta http-equiv="refresh" content="0; url=https://ibsongee75.github.io/student_report/">

    <script>
        /* Send visitors to the new address and keep everything after the
           address (?code=... and #access_token=...), so links from old
           confirmation / password-reset emails still work. */
        (function () {
            var newBase = "https://ibsongee75.github.io/student_report/";
            window.location.replace(newBase + window.location.search + window.location.hash);
        })();
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 60px 20px;
            color: #1b2a4a;
        }
        a { color: #b3261e; font-weight: bold; }
    </style>

</head>
<body>

    <h1>This website has moved</h1>

    <p>
        Taking you to the new address…
    </p>

    <p>
        If nothing happens,
        <a href="https://ibsongee75.github.io/student_report/">click here</a>.
    </p>

</body>
</html>
